<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Archive - Notes</title>
    <link rel="stylesheet" href="archive.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header">
        <div class="logo-container">
            <img src="https://www.gstatic.com/images/branding/product/1x/keep_2020q4_48dp.png" alt="logo" width="40">
            <span class="product-name">Keep</span>
        </div>

        <div class="search-container">
            <input type="text" id="search-bar" placeholder="Search">
        </div>

        <div class="header-spacer"></div>
    </header>

    <div class="app-container">

        <aside class="sidebar">
            <div class="menu-item">Notes</div>
            <div class="menu-item">Reminders</div>
            <div class="menu-item">Edit labels</div>
            <div class="menu-item active">Archive</div>
            <div class="menu-item">Trash</div>
        </aside>

        <div class="main-content">

            <header class="topbar">
                <h1>Archive</h1>
            </header>

            <main class="notes-container">

                <div class="note">
                    <h3>Shopping List</h3>
                    <p>Milk, Bread, Eggs</p>
                </div>

                <div class="note">
                    <h3>Ideas</h3>
                    <p>Build a note app clone</p>
                </div>

                <div class="note">
                    <h3>Reminder</h3>
                    <p>Study CSS Grid</p>
                </div>

            </main>

        </div>

    </div>

</body>
</html>
