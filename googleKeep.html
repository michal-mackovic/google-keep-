<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Keep Clone</title>
    <link rel="stylesheet" href="googleKeep.css">
</head>
<body>

    <header class="header">
        <div class="logo-container">
            <img src="https://www.gstatic.com/images/branding/product/1x/keep_2020q4_48dp.png" alt="logo">
            <span class="product-name">Keep</span>
        </div>
    </header>

    <main>
        <section id="input-area">
            <form id="keep-form">
                <input type="text" id="note-title" placeholder="Title" autocomplete="off">
                <textarea id="note-text" placeholder="Take a note..."></textarea>
                <div class="form-actions">
                    <button type="submit" id="submit-btn">Close</button>
                </div>
            </form>
        </section>

        <div id="notes-display-grid"></div>
    </main>

    <script src="googleKeep.js"></script>
</body>
</html>
